name: CI

on:
  push:
  pull_request:

jobs:
  accept:
    name: typecheck · lint · test · build · e2e
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Preview smoke + acceptance
        env:
          BROWSER_SMOKE_TIMEOUT_MS: "60000"
          HOST: 127.0.0.1
          PORT: "8080"
        run: |
          npm run preview &
          preview_pid=$!
          trap 'kill $preview_pid 2>/dev/null || true' EXIT
          node scripts/wait-http.mjs http://127.0.0.1:8080/
          npm run test:smoke
          npm run test:e2e
